# Description: Run tests on pull requests and pushes.
# Description: Validates code quality with linting and pytest.

name: Test

on:
  push:
    branches: [main, build]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; pushes to main
# and build always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Without this, uv follows .python-version and every leg runs 3.11.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run linter
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      # Fails when mypy's error count rises above mypy-baseline.txt. Only the 3.11
      # leg runs it: pyproject.toml pins mypy to python_version 3.11.
      - name: Type check (ratchet)
        if: matrix.python-version == '3.11'
        run: uv run python scripts/mypy_ratchet.py

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      # Generated artifacts must be committed alongside tool changes. The suite
      # already compares them, but this step names the fix instead of surfacing
      # an opaque assertion failure.
      - name: Check generated files are up to date
        run: |
          uv run python tests/test_tool_contract.py
          uv run python tests/test_tools_doc.py
          if ! git diff --quiet -- tests/fixtures/tool_list.json documentation/tools.md; then
            echo "::error::Generated files are out of date. Run:"
            echo "  uv run python tests/test_tool_contract.py"
            echo "  uv run python tests/test_tools_doc.py"
            echo "and commit the result."
            git diff --stat -- tests/fixtures/tool_list.json documentation/tools.md
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.27"

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
