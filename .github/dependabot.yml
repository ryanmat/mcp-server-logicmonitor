# Description: Weekly dependency updates for Python packages, actions and images.
# Description: Minor and patch updates arrive grouped, one pull request per ecosystem.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    # The base image's Python minor moves with the CI test matrix, by hand.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
