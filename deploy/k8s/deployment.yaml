# Description: Vendor-neutral Kubernetes manifests for the LogicMonitor MCP server.
# Description: Runs the published ghcr image over the HTTP transport on any cluster.
#
# Works on AKS, EKS, GKE, OpenShift, or vanilla Kubernetes. Nothing here is
# cloud-specific.
#
# Before applying, create the credentials secret (never commit these values):
#
#   kubectl create secret generic lm-mcp-credentials \
#     --from-literal=portal=yourcompany.logicmonitor.com \
#     --from-literal=bearer-token='<your LM bearer token>' \
#     --from-literal=http-auth-token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
#
# Then:  kubectl apply -f deploy/k8s/deployment.yaml
#
# Clients reach the server at http://mcp-server-logicmonitor:8080/mcp inside the
# cluster and must send "Authorization: Bearer <http-auth-token>". Expose it
# outside the cluster only behind TLS (an Ingress or Route that terminates HTTPS).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-logicmonitor
  labels:
    app: mcp-server-logicmonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server-logicmonitor
  template:
    metadata:
      labels:
        app: mcp-server-logicmonitor
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server-logicmonitor
          # Pin a release tag (for example :v4.2.0) for reproducible rollouts.
          image: ghcr.io/ryanmat/mcp-server-logicmonitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: LM_TRANSPORT
              value: http
            - name: LM_HTTP_HOST
              value: 0.0.0.0
            - name: LM_HTTP_PORT
              value: "8080"
            - name: LM_PORTAL
              valueFrom:
                secretKeyRef:
                  name: lm-mcp-credentials
                  key: portal
            - name: LM_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lm-mcp-credentials
                  key: bearer-token
            # Requires a bearer token on /mcp and /api/v1/*. Drop this block only
            # if the service is unreachable from outside the cluster.
            - name: LM_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lm-mcp-credentials
                  key: http-auth-token
            # Write tools stay disabled unless you opt in.
            - name: LM_ENABLE_WRITE_OPERATIONS
              value: "false"
            - name: LM_LOG_LEVEL
              value: warning
          # Probe paths are exempt from inbound auth by design.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-logicmonitor
  labels:
    app: mcp-server-logicmonitor
spec:
  type: ClusterIP
  selector:
    app: mcp-server-logicmonitor
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
